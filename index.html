<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordwise</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <div id="app-container">
        <aside class="side-bar">
            <header>
                <h1>Nordwise</h1>
                <p>Where should I live in Finland?</p>
            </header>

        </aside>
        
        <main class="map-container">
            <section class="chart-panel">
                <h2>Rent comparison</h2>
                <p>Average monthly rent per square metre</p>
                <div id="rent-chart"></div>
            </section>
            
            <section class="chart-panel">
                <h2>Rent history</h2>
                <p>Average rent per square metre (€ / m²)</p>
                <div id="rent-history-chart"></div>
            </section>

            <div id="info-panel" class="info-panel">
                <p class="placeholder-text">Click anywhere!</p>
            </div>
            <div id="map"></div>
        </main>

    </div>
    <script src="https://unpkg.com/frappe-charts@1.6.1/dist/frappe-charts.min.umd.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
